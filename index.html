<style>
  :root {
    --bg: #1c1d1f;
    --bg-panel: #232426;
    --bg-panel-raised: #2a2b2e;
    --border: #34363a;
    --text: #d9d9d7;
    --text-dim: #9a9b9d;
    --text-faint: #6c6d6f;
    --accent: #8a9a94;
    --accent-soft: #5f6b67;
    --good: #7f9c85;
    --bad: #a08080;
    --radius: 10px;
    --shadow: 0 2px 10px rgba(0,0,0,0.25);
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html {
    height: 100%;
    background: var(--bg);
    overscroll-behavior: none;
  }

  body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    height: 100%;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior-y: none;
  }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: calc(env(safe-area-inset-top) + 28px) calc(env(safe-area-inset-right) + 16px)
      calc(env(safe-area-inset-bottom) + 48px) calc(env(safe-area-inset-left) + 16px);
  }

  button, .word-card, .flashcard, .cat-chip {
    -webkit-touch-callout: none;
    touch-action: manipulation;
  }

  input, textarea {
    -webkit-user-select: text;
    user-select: text;
  }

  .app {
    width: 100%;
    max-width: 880px;
  }

  header {
    text-align: center;
    margin-bottom: 28px;
  }

  header h1 {
    font-size: 1.5rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    margin: 0 0 6px;
    color: var(--text);
  }

  header p {
    margin: 0;
    color: var(--text-faint);
    font-size: 0.9rem;
  }

  nav.tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 24px;
    background: var(--bg-panel);
    padding: 6px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
  }

  nav.tabs button {
    flex: 1;
    min-height: 44px;
    padding: 12px 14px;
    background: transparent;
    border: none;
    border-radius: 8px;
    color: var(--text-dim);
    font-size: 0.95rem;
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease;
  }

  nav.tabs button.active {
    background: var(--bg-panel-raised);
    color: var(--text);
    box-shadow: inset 0 0 0 1px var(--border);
  }

  nav.tabs button:hover:not(.active) {
    color: var(--text);
  }

  section.view { display: none; }
  section.view.active { display: block; }

  /* ---------- Vocabulary list view ---------- */

  .list-controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 18px;
  }

  .search-box {
    flex: 1 1 220px;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    color: var(--text);
    font-size: 16px; /* keeps iOS Safari from auto-zooming on focus */
  }

  .search-box::placeholder { color: var(--text-faint); }
  .search-box:focus { outline: none; border-color: var(--accent-soft); }

  .category-filters {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 18px;
  }

  .cat-chip {
    padding: 9px 14px;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 20px;
    color: var(--text-dim);
    font-size: 0.78rem;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .cat-chip.active {
    background: var(--accent-soft);
    color: var(--bg);
    border-color: var(--accent-soft);
  }

  .cat-chip:hover:not(.active) {
    border-color: var(--text-faint);
    color: var(--text);
  }

  .word-count {
    color: var(--text-faint);
    font-size: 0.8rem;
    margin-bottom: 14px;
  }

  .word-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 10px;
  }

  .word-card {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
    user-select: none;
    min-height: 78px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .word-card:hover {
    background: var(--bg-panel-raised);
  }

  .word-card:active { transform: scale(0.98); }

  .word-card .kr {
    font-size: 1.15rem;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 4px;
  }

  .word-card .en {
    font-size: 0.85rem;
    color: var(--text-faint);
    transition: opacity 0.15s ease;
  }

  .word-card .en.hidden {
    opacity: 0;
    height: 0;
    overflow: hidden;
  }

  .word-card .cat-tag {
    font-size: 0.68rem;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-top: 6px;
  }

  /* ---------- Flashcards view ---------- */

  .mode-select {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }

  .mode-btn {
    flex: 1 1 140px;
    min-height: 44px;
    padding: 12px;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text-dim);
    font-size: 0.88rem;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s ease;
  }

  .mode-btn.active {
    background: var(--accent-soft);
    color: var(--bg);
    border-color: var(--accent-soft);
  }

  .flash-progress {
    text-align: center;
    color: var(--text-faint);
    font-size: 0.82rem;
    margin-bottom: 16px;
  }

  .card-stage {
    perspective: 1400px;
    max-width: 480px;
    margin: 0 auto 22px;
  }

  .flashcard {
    position: relative;
    height: 260px;
    border-radius: 16px;
    cursor: pointer;
    transform-style: preserve-3d;
    transition: transform 0.5s cubic-bezier(0.4, 0.2, 0.2, 1);
  }

  .flashcard.flipped { transform: rotateY(180deg); }

  .flashcard.no-anim { transition: none !important; }

  .card-face {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
    backface-visibility: hidden;
    border-radius: 16px;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
  }

  .card-face .word {
    font-size: 2rem;
    font-weight: 600;
    color: var(--text);
    line-height: 1.3;
  }

  .card-face .hint {
    margin-top: 14px;
    color: var(--text-faint);
    font-size: 0.78rem;
    letter-spacing: 0.03em;
    text-transform: uppercase;
  }

  .card-back { transform: rotateY(180deg); background: var(--bg-panel-raised); }

  .tap-hint {
    text-align: center;
    color: var(--text-faint);
    font-size: 0.8rem;
    margin-bottom: 18px;
  }

  .judge-buttons {
    display: flex;
    gap: 12px;
    justify-content: center;
    max-width: 480px;
    margin: 0 auto;
    visibility: hidden;
  }

  .judge-buttons.show { visibility: visible; }

  .judge-btn {
    flex: 1;
    min-height: 48px;
    padding: 14px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    font-size: 0.95rem;
    cursor: pointer;
    background: var(--bg-panel);
    color: var(--text);
    transition: all 0.15s ease;
  }

  .judge-btn.know:hover { border-color: var(--good); color: var(--good); }
  .judge-btn.dont:hover { border-color: var(--bad); color: var(--bad); }

  .stats-panel {
    margin-top: 34px;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
  }

  .stats-panel h2 {
    font-size: 0.95rem;
    font-weight: 600;
    margin: 0 0 14px;
    color: var(--text);
  }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 14px;
    margin-bottom: 16px;
  }

  .stat-block {
    background: var(--bg-panel-raised);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
  }

  .stat-block .label {
    font-size: 0.7rem;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 6px;
  }

  .stat-block .value {
    font-size: 1.3rem;
    font-weight: 600;
    color: var(--text);
  }

  .bar-track {
    width: 100%;
    height: 6px;
    background: var(--bg);
    border-radius: 4px;
    overflow: hidden;
    margin-top: 8px;
  }

  .bar-fill {
    height: 100%;
    background: var(--accent);
    transition: width 0.3s ease;
  }

  .reset-row {
    display: flex;
    justify-content: flex-end;
  }

  .reset-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-faint);
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 0.78rem;
    cursor: pointer;
  }

  .reset-btn:hover { color: var(--bad); border-color: var(--bad); }

  .weak-words {
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }

  .weak-words .label {
    font-size: 0.7rem;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 8px;
  }

  .weak-chip {
    display: inline-block;
    background: var(--bg-panel-raised);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 9px;
    margin: 0 6px 6px 0;
    font-size: 0.8rem;
    color: var(--text-dim);
  }

  ::selection { background: var(--accent-soft); color: var(--bg); }

  @media (max-width: 480px) {
    .card-face .word { font-size: 1.6rem; }
    .flashcard { height: 220px; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Korean Vocabulary Trainer</h1>
    <p id="wordTotal"></p>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="list">Word List</button>
    <button class="tab-btn" data-tab="flash">Flashcards</button>
  </nav>

  <section class="view active" id="view-list">
    <div class="list-controls">
      <input type="text" class="search-box" id="searchBox" placeholder="Search Korean or English...">
    </div>
    <div class="category-filters" id="categoryFilters"></div>
    <div class="word-count" id="wordCount"></div>
    <div class="word-grid" id="wordGrid"></div>
  </section>

  <section class="view" id="view-flash">
    <div class="mode-select">
      <button class="mode-btn active" data-mode="kr2en">Korean &rarr; English</button>
      <button class="mode-btn" data-mode="en2kr">English &rarr; Korean</button>
      <button class="mode-btn" data-mode="mixed">Mixed</button>
    </div>

    <div class="flash-progress" id="flashProgress"></div>

    <div class="card-stage">
      <div class="flashcard" id="flashcard">
        <div class="card-face card-front">
          <div>
            <div class="word" id="cardFrontWord"></div>
            <div class="hint">tap to reveal</div>
          </div>
        </div>
        <div class="card-face card-back">
          <div>
            <div class="word" id="cardBackWord"></div>
            <div class="hint">did you know it?</div>
          </div>
        </div>
      </div>
    </div>

    <div class="tap-hint" id="tapHint">Click the card to flip it</div>

    <div class="judge-buttons" id="judgeButtons">
      <button class="judge-btn dont" id="btnDontKnow">&#10007; Didn't know it</button>
      <button class="judge-btn know" id="btnKnow">&#10003; Knew it</button>
    </div>

    <div class="stats-panel">
      <h2>Session Statistics</h2>
      <div class="stats-grid" id="statsGrid"></div>
      <div class="weak-words" id="weakWordsBlock" style="display:none;">
        <div class="label">Words to review again</div>
        <div id="weakWordsList"></div>
      </div>
      <div class="reset-row">
        <button class="reset-btn" id="resetStatsBtn">Reset all statistics</button>
      </div>
    </div>
  </section>
</div>

<script>

/* ---------------- Flashcards view ---------------- */
const STORAGE_KEY = 'korean_flashcard_stats_v1';

function loadStats() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return {
    kr2en: { known: 0, unknown: 0 },
    en2kr: { known: 0, unknown: 0 },
    mixed: { known: 0, unknown: 0 },
    perWord: {}
  };
}

function saveStats() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(stats)); } catch (e) {}
}

let stats = loadStats();
if (!stats.perWord) stats.perWord = {};

let mode = 'kr2en';
let deck = [];
let deckPos = 0;
let currentDirection = 'kr2en'; // for mixed mode, per-card
let flipped = false;

function shuffledIndices(n) {
  const arr = Array.from({length: n}, (_, i) => i);
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function buildDeck() {
  deck = shuffledIndices(VOCAB.length);
  deckPos = 0;
}

function currentWordIndex() {
  return deck[deckPos];
}

function currentDirectionForCard() {
  if (mode === 'mixed') {
    return Math.random() < 0.5 ? 'kr2en' : 'en2kr';
  }
  return mode;
}

const flashcardEl = document.getElementById('flashcard');
const cardFrontWord = document.getElementById('cardFrontWord');
const cardBackWord = document.getElementById('cardBackWord');
const flashProgress = document.getElementById('flashProgress');
const judgeButtons = document.getElementById('judgeButtons');
const tapHint = document.getElementById('tapHint');

function showCard() {
  flipped = false;

  // Snap back to the front face instantly (no spin) so the next word's
  // answer is never visible mid-rotation. The flip animation is only
  // ever seen when the user deliberately taps to reveal an answer.
  flashcardEl.classList.add('no-anim');
  flashcardEl.classList.remove('flipped');

  judgeButtons.classList.remove('show');
  tapHint.style.visibility = 'visible';

  const idx = currentWordIndex();
  const w = VOCAB[idx];
  currentDirection = currentDirectionForCard();

  if (currentDirection === 'kr2en') {
    cardFrontWord.textContent = w.kr;
    cardBackWord.textContent = w.en;
  } else {
    cardFrontWord.textContent = w.en;
    cardBackWord.textContent = w.kr;
  }

  flashProgress.textContent = 'Card ' + (deckPos + 1) + ' of ' + deck.length +
    '  ·  ' + (mode === 'kr2en' ? 'Korean \u2192 English' : mode === 'en2kr' ? 'English \u2192 Korean' : 'Mixed');

  // Force a reflow so the browser registers the instant (no-transition)
  // state before we re-enable the animated transition for the next tap.
  void flashcardEl.offsetWidth;
  flashcardEl.classList.remove('no-anim');
}

flashcardEl.addEventListener('click', () => {
  flipped = !flipped;
  flashcardEl.classList.toggle('flipped', flipped);
  if (flipped) {
    judgeButtons.classList.add('show');
    tapHint.style.visibility = 'hidden';
  } else {
    judgeButtons.classList.remove('show');
    tapHint.style.visibility = 'visible';
  }
});

function nextCard() {
  deckPos++;
  if (deckPos >= deck.length) {
    buildDeck();
  }
  showCard();
}

function recordJudgement(knew) {
  const idx = currentWordIndex();
  const w = VOCAB[idx];
  const bucket = mode === 'mixed' ? 'mixed' : mode;
  stats[bucket][knew ? 'known' : 'unknown']++;

  if (!stats.perWord[w.kr]) stats.perWord[w.kr] = { known: 0, unknown: 0 };
  stats.perWord[w.kr][knew ? 'known' : 'unknown']++;

  saveStats();
  renderStats();
  nextCard();
}

document.getElementById('btnKnow').addEventListener('click', (e) => {
  e.stopPropagation();
  if (!flipped) return;
  recordJudgement(true);
});

document.getElementById('btnDontKnow').addEventListener('click', (e) => {
  e.stopPropagation();
  if (!flipped) return;
  recordJudgement(false);
});

document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    mode = btn.dataset.mode;
    buildDeck();
    showCard();
  });
});

document.addEventListener('keydown', (e) => {
  if (!document.getElementById('view-flash').classList.contains('active')) return;
  if (e.code === 'Space') {
    e.preventDefault();
    flashcardEl.click();
  } else if (flipped && (e.key === 'ArrowRight' || e.key === '1')) {
    recordJudgement(true);
  } else if (flipped && (e.key === 'ArrowLeft' || e.key === '0')) {
    recordJudgement(false);
  }
});

/* ---------------- Stats rendering ---------------- */
const statsGrid = document.getElementById('statsGrid');
const weakWordsBlock = document.getElementById('weakWordsBlock');
const weakWordsList = document.getElementById('weakWordsList');

function pct(known, unknown) {
  const total = known + unknown;
  if (total === 0) return 0;
  return Math.round((known / total) * 100);
}

function renderStats() {
  const modes = [
    { key: 'kr2en', label: 'Korean \u2192 English' },
    { key: 'en2kr', label: 'English \u2192 Korean' },
    { key: 'mixed', label: 'Mixed' }
  ];

  let totalKnown = 0, totalUnknown = 0;
  let html = '';

  modes.forEach(m => {
    const s = stats[m.key];
    totalKnown += s.known;
    totalUnknown += s.unknown;
    const total = s.known + s.unknown;
    const p = pct(s.known, s.unknown);
    html += `
      <div class="stat-block">
        <div class="label">${m.label}</div>
        <div class="value">${total === 0 ? '—' : p + '%'}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${p}%;"></div></div>
      </div>
    `;
  });

  const overallTotal = totalKnown + totalUnknown;
  html += `
    <div class="stat-block">
      <div class="label">Total reviewed</div>
      <div class="value">${overallTotal}</div>
    </div>
    <div class="stat-block">
      <div class="label">Overall accuracy</div>
      <div class="value">${overallTotal === 0 ? '—' : pct(totalKnown, totalUnknown) + '%'}</div>
    </div>
  `;

  statsGrid.innerHTML = html;

  const weak = Object.entries(stats.perWord)
    .filter(([_, v]) => v.unknown > 0 && v.unknown >= v.known)
    .sort((a, b) => (b[1].unknown - b[1].known) - (a[1].unknown - a[1].known))
    .slice(0, 12);

  if (weak.length > 0) {
    weakWordsBlock.style.display = 'block';
    weakWordsList.innerHTML = weak.map(([kr, v]) => {
      const w = VOCAB.find(item => item.kr === kr);
      const label = w ? (kr + ' — ' + w.en) : kr;
      return `<span class="weak-chip">${label}</span>`;
    }).join('');
  } else {
    weakWordsBlock.style.display = 'none';
  }
}

document.getElementById('resetStatsBtn').addEventListener('click', () => {
  if (!confirm('Reset all flashcard statistics? This cannot be undone.')) return;
  stats = { kr2en: { known: 0, unknown: 0 }, en2kr: { known: 0, unknown: 0 }, mixed: { known: 0, unknown: 0 }, perWord: {} };
  saveStats();
  renderStats();
});

document.addEventListener('gesturechange', (e) => e.preventDefault());

// Prevent the double-tap-to-zoom gesture on rapid taps
let lastTouchEnd = 0;
document.addEventListener('touchend', (e) => {
  const now = Date.now();
  if (now - lastTouchEnd <= 300) e.preventDefault();
  lastTouchEnd = now;
}, { passive: false });

// Suppress the long-press callout/context menu on interactive elements
document.querySelectorAll('.word-card, .flashcard, button').forEach(el => {
  el.addEventListener('contextmenu', (e) => e.preventDefault());
});

/* ---------------- Init ---------------- */
buildDeck();
showCard();
renderStats();
</script>
</body>
</html>
